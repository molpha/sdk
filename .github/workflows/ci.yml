name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select deployment profile
        # PRs into main (and pushes on main) bake the stable defaults; everything else uses dev.
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.base_ref }}"
          else
            base="${{ github.ref_name }}"
          fi
          if [ "$base" = "main" ]; then
            echo "MOLPHA_SDK_PROFILE=stable" >> "$GITHUB_ENV"
          else
            echo "MOLPHA_SDK_PROFILE=dev" >> "$GITHUB_ENV"
          fi
          echo "Using MOLPHA_SDK_PROFILE for base=$base"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  changeset:
    name: Changeset present
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fails if the PR has no changeset. Add an empty one (`pnpm changeset --empty`)
      # for changes that intentionally don't need a release.
      - name: Verify changeset
        run: pnpm changeset status --since=origin/${{ github.base_ref }}
